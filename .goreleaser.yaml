# Release PUBLICATION for qompack (00-ARCHITECTURE.md §2.6, §8). goreleaser no longer BUILDS.
#
# SP-01 wrote this file as a six-target build configuration with `release.disable: true` holding
# the publication half open. SP-17 Task 7 closes it the other way round, because two build paths
# writing the same `internal/core.Version` symbol is a defect rather than redundancy: goreleaser
# compiled with `-trimpath` and `-ldflags "-s -w -X …"` only, while `devtool bundle` adds
# `-buildvcs=false` and `-buildid=` — the two flags that make two builds of the same source
# byte-identical (packaging/README.md §4 called this "the goreleaser gap").
#
# So every build entry is skipped, and the artifacts come from ONE place:
#
#     go run ./tools/devtool bundle --archive
#
# which assembles the per-target plugin bundle, packs it reproducibly, and writes
# dist/bundle/checksums.txt, then `devtool marketplace`, which writes dist/bundle/marketplace.json
# from it. `release.extra_files` below names exactly those files, plus the repository's LICENSE and
# THIRD_PARTY_NOTICES.md (which every zip also carries). goreleaser's remaining job is to create the
# GitHub release and upload them.
#
# The release is a DRAFT. A tag therefore produces something a human reviews and publishes; nothing
# reaches users because a tag was pushed. test/guards/release_test.go pins all of this.
version: 2

project_name: qompack

# goreleaser --clean removes this directory. It must not be `dist`, or the archives under
# dist/bundle/ and dist/release-notes.md would vanish before extra_files could upload them.
dist: dist/goreleaser

builds:
  # Kept, not deleted: an absent `builds` section would make goreleaser fall back to its default
  # build of ./... , which is the opposite of what this file now says. The entry stays so the
  # disablement is explicit and reviewable.
  - id: qompack
    skip: true

# No `archives:` section. Archiving is `devtool bundle --archive`'s job — zip entries sorted by
# slash path, a fixed DOS-epoch mtime and normalised Unix modes — and an archives block over skipped
# builds would have nothing to pack.

checksum:
  # dist/bundle/checksums.txt (written by `devtool bundle --archive`, in `sha256sum` format) is the
  # one checksum document. A second one generated here would cover files goreleaser did not build.
  disable: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  use: git
  sort: asc

release:
  draft: true
  # Published from the draft as a pre-release first (D53(h)(2)): the HTTPS install rehearsal and
  # the bin/ byte check run against it, and only then is it promoted to the latest release, which
  # is what fires marketplace.yml.
  prerelease: true
  # Every target ships a .zip (C7.5: a marketplace `archive` source is a zip), so there is no
  # *.tar.gz glob; one that matched nothing would fail the upload. marketplace.json is generated by
  # `devtool marketplace` from checksums.txt and pins each zip by sha256.
  extra_files:
    - glob: dist/bundle/*.zip
    - glob: dist/bundle/checksums.txt
    - glob: dist/bundle/marketplace.json
    # Every zip already carries LICENSE and THIRD_PARTY_NOTICES.md at its root (`devtool bundle`):
    # the binary statically links the Go runtime, go-winio, klauspost/compress and x/sys, whose
    # licences ask for their notices in a binary distribution (V6 close-out audit F4, D53(e)).
    # The release page offers both beside the zips as well, so a reader need not unpack one.
    - glob: LICENSE
    - glob: THIRD_PARTY_NOTICES.md
