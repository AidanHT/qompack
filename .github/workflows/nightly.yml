name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/canon,      fn: FuzzCanonicalize }
          - { pkg: ./internal/canon,      fn: FuzzNumericMatchesAgreeWithReference }
          - { pkg: ./internal/canon,      fn: FuzzPrefilterAgreesWithFullScan }
          - { pkg: ./internal/canon,      fn: FuzzRestore }
          - { pkg: ./internal/canon,      fn: FuzzTrailingWSAgreesWithReference }
          - { pkg: ./internal/checkpoint, fn: FuzzParseGitIndex }
          - { pkg: ./internal/checkpoint, fn: FuzzStripInjections }
          - { pkg: ./internal/chunk,      fn: FuzzSplit }
          - { pkg: ./internal/chunk,      fn: FuzzSplitStream }
          - { pkg: ./internal/config,     fn: FuzzConfigLoad }
          - { pkg: ./internal/daemon,     fn: FuzzDeliverySealSelect }
          - { pkg: ./internal/eval,       fn: FuzzRedact }
          - { pkg: ./internal/hookio,     fn: FuzzReadEvent }
          - { pkg: ./internal/ipc,        fn: FuzzDecodeRequest }
          - { pkg: ./internal/mcp,        fn: FuzzServeLine }
          - { pkg: ./internal/observer,   fn: FuzzExtractSignals }
          - { pkg: ./internal/redact,     fn: FuzzRedactIdempotent }
          - { pkg: ./internal/redact,     fn: FuzzRedactPrefilterEquivalence }
          - { pkg: ./internal/rehydrate,  fn: FuzzBuild_HostCeiling }
          - { pkg: ./internal/sketch,     fn: FuzzBloomUnmarshalBinary }
          - { pkg: ./internal/sketch,     fn: FuzzCMSUnmarshalBinary }
          - { pkg: ./internal/sketch,     fn: FuzzHLLUnmarshalBinary }
          - { pkg: ./internal/sketch,     fn: FuzzMisraGriesUnmarshalBinary }
          - { pkg: ./internal/sketch,     fn: FuzzSignatureUnmarshalBinary }
          - { pkg: ./internal/symbols,    fn: FuzzExtract }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      # The matrix names every fuzz target the finished tree will carry, including ones whose
      # package is still a stub owned by a later subplan. `go test -fuzz` on a target that does not
      # exist yet fails the job, for the correct reason that nobody has written it — which is not a
      # signal worth waking up to.
      #
      # A missing target is therefore reported and skipped rather than failing, and the skip is
      # loud (§13 invariant 10). It is not silent forever either: TestNightlyFuzzMatrix in
      # test/guards fails as soon as its owning subplan lands while the declared target is still
      # absent, so the leg is owed the moment the owner lands and not before.
      #
      # Twenty rows at V2, of which NINETEEN existed then and ran for real. The single skip was
      # internal/checkpoint's FuzzCheckpointJSON — SP-10, wave 4 — a name the plan proposed and
      # SP-10 never wrote; at the wave-3 integration (SP-19 M0-00) that row became the two targets
      # SP-10 actually shipped, FuzzParseGitIndex and FuzzStripInjections. The wave-1 reconciliation
      # (V2-VERIFY §2.0 V2-MERGE-01) replaced three rows that named functions existing nowhere in
      # the tree — ipc/FuzzFraming, redact/FuzzRedact and sketch/FuzzUnmarshalBinary — and added
      # the fifteen targets SP-03, SP-04, SP-05 and SP-06 shipped with no row at all. nightly.yml
      # is SP-05-owned, so every other wave-1 branch's targets arrived unregistered by
      # construction; the matrix is reconciled on the (pkg, fn) PAIR, never on the name, because
      # `FuzzRedact` exists in internal/eval and not in internal/redact.
      #
      # The V5 close-out ran the inventory both ways again and found two targets with no row:
      # internal/mcp's FuzzServeLine, which SP-13 shipped unregistered and which is added here, and
      # internal/daemon's FuzzDeliverySealSelect, which arrives with SP20-D1's v2 seal and is added
      # in the commit that lands it. TestNightlyFuzzMatrix can only check the matrix's direction, so
      # this half is owed to the wave checkpoint every time.
      #
      # The V6 close-out's C1.14 (owner decision D5) shipped internal/rehydrate's
      # FuzzBuild_HostCeiling, the fuzz half of the claim that no compact rehydration exceeds the
      # host's additionalContext ceiling. Its review found it unregistered, the only Fuzz* target in
      # internal/ with no row, and it was added on the same branch.
      - name: fuzz ${{ matrix.target.fn }}
        run: |
          if ! go test -run '^$' -list '^${{ matrix.target.fn }}$' ${{ matrix.target.pkg }} 2>/dev/null | grep -q '^${{ matrix.target.fn }}$'; then
            echo "::warning title=fuzz target not yet written::${{ matrix.target.fn }} is declared in the nightly matrix but does not exist in ${{ matrix.target.pkg }}; its owner has not landed it yet (see test/guards TestNightlyFuzzMatrix)"
            exit 0
          fi
          go test -run '^$' -fuzz '^${{ matrix.target.fn }}$' -fuzztime 10m ${{ matrix.target.pkg }}

  race-windows:
    # CGO is required for -race, so this job deliberately overrides the workflow-level
    # CGO_ENABLED=0. The shipped binary is still built with CGO off (see crossbuild).
    runs-on: windows-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      # -timeout=30m is the repository's whole-tree timeout (tools/devtool/test.go's
      # wholeTreeTestTimeout, ci.yml's race job). Without it this job took go test's 10m default
      # and test/e2e — the slowest package, slower again under -race on Windows — panicked at
      # 600s mid-TestPhase1_CorpusSweep rather than finishing.
      #
      # test/e2e is excluded for the same reason ci.yml's `test` job excludes it, and with the
      # same measurement: under -race the package does not finish in 30 minutes on any runner, and
      # a test-only -race flag instruments the harness rather than its go-build children.
      # The race-product-child job below instruments selected real child paths separately.
      # ci.yml's `test-e2e` runs the ordinary package alone. The
      # co-load declaration is the same one ci.yml's `test` job makes, for the same run shape.
      - shell: bash
        env:
          QOMPACK_UNDER_COLOAD: '1'
        run: go test -race -timeout=30m $(go list ./... | grep -v '/test/e2e$')

  race-product-child:
    # One executable per test process; GOFLAGS reaches Build(t)'s child go build.
    # The independent build-info assertion fails if that inheritance is lost.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
      GOFLAGS: '-race'
      GOMAXPROCS: '2'
      QOMPACK_REQUIRE_CHILD_RACE: '1'
      QOMPACK_UNDER_COLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      - name: exercise instrumented product children
        shell: bash
        run: |
          mkdir -p race-artifacts
          export GORACE="halt_on_error=1 log_path=$PWD/race-artifacts/race"
          rc=0
          go test -count=1 -timeout=15m -v ./test/e2e -run '^(TestE2E_RequiredProductChildRaceInstrumentation|TestE2EHookRoundTrip|TestE2E_ObserverThroughDaemon|TestE2E_SupersessionVisibleAfterRestart|TestE2E_VerbatimPromptSurvivesRestart|TestE2E_SessionStartCompactRestoresCheckpointItems|TestStdioServerEndToEnd|TestV3_CrashRecoveryReplaysObserverAndLedgerConsistently)$' > race-artifacts/test.log 2>&1 || rc=$?
          cat race-artifacts/test.log
          if find race-artifacts -name 'race.*' -type f -size +0c | grep -q .; then
            echo 'A product child or its harness reported a race.'
            rc=1
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: race-product-child, path: race-artifacts/ }

  bench-deep:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ── Non-reference disk (owner Q1, third option; D53(e), D55) ─────────────────────────────────
    # The same declaration ci.yml's bench-gate makes, for the same reason: this job runs the
    # hot-path harness alone on a GitHub-hosted runner, whose disk carries an fsync tail no budget
    # priced on a quiet reference host survives (run 36820740318, windows-latest: B-B p99
    # 1310.7 ms and B-A p99 1441.8 ms against 50). Hosted figures never become constants (Q1), and
    # the runner is not co-loaded. The fsync-bound wall rows (B-A, B-B, B-E's wall row) and the
    # spool-submode transition are reported with a note naming the declaration; B-E_cpu, the
    # delivery ledger (identity, 0 lost), the population census and every structural check stay
    # gated. Honoured only where GITHUB_ACTIONS=true (internal/obs.NonReferenceDiskEnv); test/guards'
    # TestNonReferenceDisk_IsHostedCIOnly pins this job as nightly.yml's only declaring job.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      - run: go run ./tools/devtool bench-hotpath --iterations 5000 --hook observe-tool --warm-daemon --json "bench-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        with: { name: "bench-${{ matrix.os }}", path: "bench-${{ matrix.os }}.json" }

  # Deterministic replay over the RECORDED corpus (§6.3 tier 2). The corpus is what makes this run
  # different from ci.yml's replay-gate — not the mode. Live mode (§6.3 tier 3) is run by no
  # workflow at all, because no workflow may call a model: the real-host harness V6 C5.4 built
  # (`devtool live-eval`, gated by QOMPACK_LIVE_EVAL=1, and eval.HostForkRunner behind replay's live
  # mode, gated by QOMPACK_EVAL_LIVE=1) runs only on a developer's machine, and no shipped build
  # installs an eval.LiveRunner, so the old `replay-live` name described something that has never
  # existed here.
  replay-recorded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      - name: deterministic replay over the recorded corpus
        env:
          QOMPACK_SESSIONS_DIR: ${{ secrets.QOMPACK_SESSIONS_DIR }}
        run: |
          if [ -z "$QOMPACK_SESSIONS_DIR" ]; then
            echo "no recorded corpus configured; skipping the recorded replay (§6.3 tier 2)"
            exit 0
          fi
          # --baseline "" is deliberate and is the only honest setting today. This job used to pass
          # `--baseline develop`, which resolves to the committed SYNTHETIC baseline, so the 2% rule
          # was comparing a recorded corpus against a generated one — the cross-tier comparison the
          # corpusTier key exists to prevent, and which the driver now refuses outright. No recorded
          # baseline is committed (the corpus lives in a secret directory and is not ours to commit),
          # so this run MEASURES rather than compares, and uploads the numbers it measured.
          go run ./tools/devtool replay --corpus "$QOMPACK_SESSIONS_DIR" --baseline "" --out replay-recorded.json
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('replay-recorded.json') != '' }}
        with: { name: replay-recorded, path: replay-recorded.json }
