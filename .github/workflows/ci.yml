name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool fmt-check
      - run: go run ./tools/devtool lint
      - run: go vet ./...
      - run: go build ./...
      - name: reject attribution trailers
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          if git log --format=%B "$base..HEAD" | grep -Eiq 'Co-Authored-By|Signed-off-by|Generated with|🤖'; then
            echo "attribution trailer found in commit range (§10)"; exit 1
          fi
      # The trailing-period check is separate from the pattern because "." in the subject regexp
      # matches a literal period like any other character, so the pattern alone accepts a subject
      # that ends in one. §10 forbids it and the local commit-msg hook rejects it, which is the
      # worse shape of the two: a rule enforced before push but not after is one that only catches
      # people who installed the hook.
      - name: conventional commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          bad=0
          while IFS= read -r s; do
            [ -z "$s" ] && continue
            echo "$s" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9/_.,-]+\))?: .{1,64}$' \
              || { echo "bad subject: $s"; bad=1; }
            case "$s" in
              *.) echo "subject must not end with a period (§10): $s"; bad=1 ;;
            esac
          done < <(git log --format=%s "$base..HEAD")
          exit $bad

  lint-windows:
    # `devtool lint` ran on ubuntu only, and parts of it are blind there by construction.
    #
    #   - stubskips greps the output of a REAL `go test -json` run rather than reading source, so a
    #     t.Skip behind `runtime.GOOS == "windows"` never reaches it on Linux. That is not
    #     hypothetical: the three skips in internal/paths/errorpaths_test.go opened with "notice: "
    #     from 96ccfcb to cc48ec6 and made `devtool lint` red for a day, with no CI job on any
    #     platform able to see it. A run of this job on Windows lists nine platform-gated skips —
    #     including internal/ipc's TestWindowsPipeACLRejectsOtherUser, which lives in a
    #     //go:build windows file and therefore does not exist at all on a Linux runner.
    #   - golangci-lint, nomagic, importgraph and testdeps all load packages through the HOST's
    #     build constraints, so the nine //go:build windows files (internal/ipc/listen_windows.go,
    #     internal/daemon/lock_windows.go, internal/paths/long_windows.go, …) are linted nowhere.
    #
    # This runs the whole lint rather than `--only=` a subset, deliberately. An allowlist of "the
    # GOOS-sensitive sub-checks" is a second list to keep in sync with lintSubchecks, and its
    # failure mode when it goes stale — a new sub-check silently not running on Windows — is the
    # exact invisibility this job exists to remove. The sub-checks an allowlist would drop are also
    # the cheap ones (bindeps iterates its own GOOS matrix, sleepcheck parses every file regardless
    # of build tags, runpatterns and docmarkers read Markdown), so it would buy no minutes worth the
    # risk. The cost that matters is stubskips' `go test` over internal/, cmd/ and test/, and that is
    # not removable: the check IS a test run. It is two passes since run 36816905394: the tree in
    # parallel, then test/e2e alone, for the reason the `test` job leaves test/e2e to `test-e2e`
    # (tools/devtool/test.go, isolatedPackages).
    #
    # It is a separate job rather than a Windows leg of `verify` because nothing else in verify —
    # fmt-check, go vet, go build, the two git-history greps — is platform-sensitive, and paying for
    # those twice buys nothing. It also keeps `devtool ci-local`, which already runs the full lint,
    # honest about what CI checks.
    runs-on: windows-latest
    # The backstop for plausibly the longest job in the matrix: the stubskips sub-check runs a real
    # `go test` over internal/, cmd/ and test/ at the repository's own -timeout=30m, on the slowest
    # runner OS. Go's timeout is per test binary, so a job that wedges outside one — a hung child
    # process, a stalled runner — would sit until GitHub's 360-minute platform default.
    #
    # 75, from run 36816905394's job 110223848264 (it was 45 for one pass). -timeout bounds each
    # test binary, not each pass: a pass runs several binaries at once and can outlast 30 minutes.
    # Measured there: checkout and setup about 1 minute (04:49:41 to 04:50:30); the sub-checks before
    # stubskips about 4 (to 04:54:26); then ONE whole-tree pass of 38 minutes (to 05:32:33), whose
    # length was test/e2e's binary starting about 8 minutes in and being killed at its 30, so the
    # tree was only partly inspected. Split, the first pass is the tree without test/e2e: not yet
    # measured alone, bounded above by those 38 minutes (every other binary finished inside them,
    # with test/e2e loading the runner) and plausibly 25 to 35. The second is test/e2e alone: about
    # 20 minutes (that run's test-e2e job, 1188 s), killed at 30 if it hangs. Expected 1 + 4 + 30 +
    # 20, about 55; worst case 1 + 4 + 38 + 30 = 73, a thin 2-minute margin, so stubskips now prints
    # each pass's start and duration and the next run measures the first pass directly. No
    # per-binary -timeout moved: a hung test is still killed at 30 minutes and still reported, and
    # this bound still catches a wedge outside a binary. The owner sets the value (wave 16 ci seat,
    # needs_owner).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool lint

  test:
    # Every setup-go step pins the exact patch go.mod's toolchain line names, and
    # TestWorkflowGoVersionMatchesToolchain fails the build if the two ever disagree.
    #
    # Two weaker spellings were tried first and both silently ran the wrong Go. A range ('1.26.x')
    # installed go1.26.5 against a go.mod pinning toolchain go1.26.6, and GOTOOLCHAIN=local IGNORES
    # the toolchain directive rather than enforcing it, so nothing failed — the build just ran on a
    # Go still carrying four stdlib advisories (GO-2026-5972, -6090, -6091, -6218), which the
    # security job reported as four vulnerabilities the code calls. go-version-file: go.mod is no
    # better: setup-go reads the `go 1.26` directive out of it, not `toolchain`, and resolves the
    # same 1.26.5. Only the exact version works, and only a guard keeps it honest.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # This job is the whole tree at once: about twenty package binaries sharing a two-core
      # runner, several of them spawning real processes of their own. That is a fact about the
      # RUN, and the tests cannot see it from inside, so the job states it. What the declaration
      # licenses is narrow and is spelled out on internal/obs.UnderColoadEnv: a wall-clock
      # budget may be judged on the process's own CPU time instead, or — where the property is
      # intrinsically wall-clock — reported here and judged in the `timing` and `test-e2e` jobs
      # below, which run those tests alone and do NOT set this. Nothing is skipped and nothing
      # about what the product DID is relaxed.
      #
      # The evidence is this job's own history: it had never been green. On one commit, on one
      # windows runner, minutes apart, B-A's p99 measured 3.072 ms in bench-gate (the harness
      # alone) and 11.264 ms then 18.432 ms here, against a 15 ms limit, with the product
      # byte-identical — a coin flip on scheduler weather. See docs/adr/0010.
      QOMPACK_UNDER_COLOAD: '1'
      # ── Expected failures ───────────────────────────────────────────────────────────────────────
      # A row that is DELIBERATELY red, an open item a wave report names, is listed here. The list
      # is empty at the V5 close-out. The four carried defects that stood here (SP05-D1, SP06-D2,
      # SP08-D1, SP10-D1; plans/V4-report.md section 19) were fixed or deferred to V6-VERIFY by
      # V5-VERIFY, so TestCarriedDefects_WaveReportRequiresResolution passes, and the Belady
      # p_min floor that stood beside them was retired by the owner on 2026-09-10 (its test now
      # pins the exact measurement, test/integration/dagselection_test.go).
      #
      # Enumerating red rows is what keeps the signal: without the list a job with one known red
      # row could never be green, and a genuine new failure beside it would be indistinguishable
      # at the job level. The list is enforced in BOTH directions: an unlisted row that fails
      # breaks the build, and a listed row that PASSES breaks the build too — a defect that gets
      # fixed must be struck from here, and from the report, in the same change that fixes it.
      #
      # A subtest failure also fails its parent and its package, so a listed subtest brings its
      # parent row into this list and its package into EXPECTED_FAILING_PACKAGES below.
      EXPECTED_FAILING_ROWS: ''
      EXPECTED_FAILING_PACKAGES: ''
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      # test/e2e is excluded from the whole-tree run and has its own job (`test-e2e`). Two
      # reasons, both measured. Under -race the package does not finish inside the repository's
      # 30-minute whole-tree timeout on ubuntu or macos — run 34052269275 timed out with
      # TestV3_FullCorpusIngestThroughObserverAndLedger six minutes into its own run, over budget
      # rather than hung — where the same package takes 291 s without the detector. And it is the
      # package whose timing rows are intrinsically wall-clock (X-11 measures a hook's spawn-to-ack
      # latency), so it is the one that most needs a runner to itself.
      #
      # `shell: bash` on every runner, Windows included, so the package-list substitution is one
      # spelling everywhere; the Windows runner's Git Bash is what actions/checkout already uses.
      # ONE step for all three runners, with the flags chosen inside it, because the
      # expected-failure reconciliation below must be identical on every runner and a second copy
      # of it is a second thing to drift.
      #
      # CGO is required for -race, so this step deliberately overrides the workflow-level
      # CGO_ENABLED=0 the same way nightly.yml's race-windows job does. Without it `go test
      # -race` does not run the suite under the detector and fall back to a plain run — it
      # refuses outright with "-race requires cgo" and exits 2, which is how this job failed
      # on the very first CI run this repository ever had. The shipped binaries are still
      # built with CGO off; see crossbuild. Windows runs -count=2 without the detector instead.
      - name: test (whole tree, with an expected-failure reconciliation)
        env:
          CGO_ENABLED: ${{ runner.os == 'Windows' && '0' || '1' }}
        shell: bash
        run: |
          # `shell: bash` defaults to `-eo pipefail`, and BOTH would abort this step before it
          # could reconcile anything: `go test` exits non-zero by design here, and a `grep` that
          # matches nothing (the good case, for a green package set) exits 1 too.
          set +e -u
          # -timeout is per test binary, and devtool's wholeTreeTestTimeout (30m) is sized for ONE
          # pass of the whole tree. -count=2 runs every test of a binary twice inside that one
          # budget, so the Windows leg gets two passes' worth: 2 x 30m = 60m (owner ruling D55).
          # Measured: internal/daemon was killed at 1800 s in run 36816905394's windows test job
          # under -count=2; alone at -count=2 on a loaded local Windows host it took 527 s with no
          # hang (plans/sdd/V6-closeout/w16-ci/runs/fix-daemon-count2-windows.log), so the kill is
          # attributed to whole-tree co-load on the two-core runner. A hosted-only hang is not yet
          # excluded: a real hang is still killed, and the reconciliation below names the tests it
          # left unfinished (c697ed1e). The other legs make one pass and keep 30m.
          if [ "$RUNNER_OS" = "Windows" ]; then
            flags='-count=2'; timeout='60m'
          else
            flags='-race'; timeout='30m'
          fi
          # shellcheck disable=SC2046  # the package list must word-split
          go test $flags -timeout="$timeout" -json $(go list ./... | grep -v '/test/e2e$') > test.json
          status=$?
          # test2json emits one object per event. A test-level verdict is the object that carries
          # Action, Test AND Elapsed; an "output" event carries no Elapsed, which is what keeps a
          # test that PRINTS this shape out of the tally.
          grep '"Action":"fail"' test.json | grep '"Elapsed":' | grep '"Test":"' | sed -n 's/.*"Package":"\([^"]*\)".*"Test":"\([^"]*\)".*/\1 \2/p' | sort -u > failed-rows.txt
          # A package-level verdict has no Test. A package that fails to BUILD, panics, or times
          # out reports only this, so it is reconciled separately — otherwise a build break in
          # test/guards would look exactly like the rows below.
          grep '"Action":"fail"' test.json | grep '"Elapsed":' | grep -v '"Test":"' | sed -n 's/.*"Package":"\([^"]*\)".*/\1/p' | sort -u > failed-pkgs.txt
          # The block scalars below already end in a newline; sed drops the blank tail and the
          # YAML indentation, leaving one "package test" (or "package") per line.
          echo "$EXPECTED_FAILING_ROWS" | sed '/^[[:space:]]*$/d;s/^[[:space:]]*//' | sort -u > expected-rows.txt
          echo "$EXPECTED_FAILING_PACKAGES" | sed '/^[[:space:]]*$/d;s/^[[:space:]]*//' | sort -u > expected-pkgs.txt
          rc=0
          if ! diff -u expected-rows.txt failed-rows.txt; then
            echo "::error::the expected-failure list is stale: a listed row started passing, or an unlisted row failed (see plans/V4-report.md section 19)"
            rc=1
          fi
          if ! diff -u expected-pkgs.txt failed-pkgs.txt; then
            echo "::error::a package failed outside the expected set, or an expected package stopped failing — a build break, panic or timeout looks like this (see plans/V4-report.md section 19)"
            rc=1
          fi
          if [ "$rc" = 0 ] && [ "$status" != 0 ]; then
            echo "the whole-tree run exited $status; every failing row is an expected one"
          fi
          # Failures are surfaced by the reconciliation, not by go test's exit code: a listed red
          # row makes that code non-zero by design. Nothing is skipped, nothing is
          # continue-on-error, and no red row is weakened — a listed row stays red locally and is
          # named above.
          # On a red reconciliation, print each failing row's OWN output rather than the last 200
          # events of the whole run: the tail is whatever package happened to finish last, and on
          # the V5 close-out's first run it held two hundred lines of a passing package while the
          # one row that mattered (a scheduler golden on macos-latest) had scrolled off it.
          if [ "$rc" != 0 ]; then
            while read -r pkg test; do
              [ -n "$pkg" ] || continue
              echo "--- output of $pkg $test ---"
              grep "\"Package\":\"$pkg\"" test.json | grep "\"Test\":\"$test\"" | grep '"Action":"output"' \
                | sed -n 's/.*"Output":"\(.*\)"}$/\1/p' | tail -n 80
            done < failed-rows.txt
            while read -r pkg; do
              [ -n "$pkg" ] || continue
              echo "--- package-level output of $pkg ---"
              grep "\"Package\":\"$pkg\"" test.json | grep -v '"Test":"' | grep '"Action":"output"' \
                | sed -n 's/.*"Output":"\(.*\)"}$/\1/p' | tail -n 40
              # A binary killed at -timeout, or one that panicked, leaves the tests it was running
              # with a "run" event and no verdict, and the panic and goroutine dump are THEIR output,
              # which the package-level lines above leave out: run 36816905394's windows-latest leg
              # printed only "FAIL internal/daemon 1800.187s". Counted per name, since -count=2 runs
              # every test twice.
              grep "\"Package\":\"$pkg\"" test.json | grep '"Test":"' \
                | grep -E '"Action":"(run|pass|fail|skip)"' \
                | sed -n 's/.*"Action":"\([a-z]*\)".*"Test":"\([^"]*\)".*/\1 \2/p' \
                | awk '$1 == "run" { n[$2]++ } $1 != "run" { n[$2]-- } END { for (t in n) if (n[t] > 0) print t }' \
                | sort > unfinished.txt
              while read -r test; do
                [ -n "$test" ] || continue
                echo "--- $pkg $test started and never finished; its last output ---"
                grep "\"Package\":\"$pkg\"" test.json | grep "\"Test\":\"$test\"" | grep '"Action":"output"' \
                  | sed -n 's/.*"Output":"\(.*\)"}$/\1/p' | tail -n 60
              done < unfinished.txt
            done < failed-pkgs.txt
          fi
          exit "$rc"

  test-e2e:
    # test/e2e alone on its own runner, and without -race: see the `test` job for why it is out
    # of the whole-tree run. Timing judgements here use the ordinary product binary.
    # nightly.yml's race-product-child job separately supplies GOFLAGS=-race, verifies
    # instrumentation on the built executable, and exercises selected product paths.
    #
    # This job does NOT set QOMPACK_UNDER_COLOAD, on purpose: it is the isolation in which
    # test/e2e's wall-clock rows are judgeable, and TestV3_HotPathUnchangedWithLedgerResident
    # judges every row here exactly as bench-gate does, except the fsync-bound wall rows the
    # non-reference-disk declaration below reports.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ── Non-reference disk (owner Q1, third option; D53(e)) ──────────────────────────────────────
    # A GitHub-hosted runner's disk is not a reference disk: its fsync latency carries a tail no
    # budget priced on a quiet reference host survives (run 36816905394: ubuntu-latest B-B p50
    # 0.576 ms but p99 40.960 ms against 15; windows-latest p50 45 ms against 50; the quiet Windows
    # reference run C5.1 read p99 22.5 ms). Hosted figures never become constants (Q1), and this
    # runner is not co-loaded, so QOMPACK_UNDER_COLOAD would name the wrong cause. The declaration
    # reports, without gating, the fsync-bound wall rows (B-A, B-B, B-E's wall row), the §12.2
    # spool-submode transition, and X10's late or deferred prompt-reply recovery branch (written to
    # the job summary), each with a note naming it; internal/obs/nonrefdisk.go lists what it
    # licenses. B-E_cpu, the delivery ledger (identity, 0 lost), the population census and every
    # structural check stay gated. It is honoured only where GITHUB_ACTIONS=true
    # (internal/obs.NonReferenceDiskEnv), the owner's quiet reference runs never set it, and
    # test/guards' TestNonReferenceDisk_IsHostedCIOnly keeps both true.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go test -count=1 -timeout=30m ./test/e2e

  timing:
    # The isolation lane: every test that yields a wall-clock judgement under QOMPACK_UNDER_COLOAD
    # is run here BY NAME, one package binary at a time (-p 1), on a runner doing nothing else,
    # and judged on the wall clock it was written against. This job does NOT set the variable.
    #
    # The list is not advisory. test/guards' TestColoadYieldersAreJudgedInIsolation reads this
    # -run pattern and fails the tree if any test that consults obs.UnderCoload is missing
    # from it (test/e2e's are covered by `test-e2e` instead), so a wall-clock budget can be
    # deferred by the whole-tree job but never dropped by the pipeline.
    #
    # What this lane cannot judge on a hosted runner is an fsync-bound wall row, for the reason
    # below: TestIntegration_HotPathWarmWithRealResidentState reports B-A, B-B and B-E's wall row
    # here and the owner's quiet reference runs judge them. Every other row named above is
    # unaffected — none of them reads the declaration.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ── Non-reference disk (owner Q1, third option; D53(e)) ──────────────────────────────────────
    # A GitHub-hosted runner's disk is not a reference disk: its fsync latency carries a tail no
    # budget priced on a quiet reference host survives (run 36816905394: ubuntu-latest B-B p50
    # 0.576 ms but p99 40.960 ms against 15; windows-latest p50 45 ms against 50; the quiet Windows
    # reference run C5.1 read p99 22.5 ms). Hosted figures never become constants (Q1), and this
    # runner is not co-loaded, so QOMPACK_UNDER_COLOAD would name the wrong cause. The declaration
    # reports, without gating, the fsync-bound wall rows (B-A, B-B, B-E's wall row) and the §12.2
    # spool-submode transition, each with a note naming it; B-E_cpu, the delivery ledger (identity,
    # 0 lost), the population census and every structural check stay gated. It is honoured only
    # where GITHUB_ACTIONS=true (internal/obs.NonReferenceDiskEnv), the owner's quiet reference runs
    # never set it, and test/guards' TestNonReferenceDisk_IsHostedCIOnly keeps both true.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go test -p 1 -count=1 -timeout=30m -run '^(TestGC_DeadlineTruncatesAndResumes|TestGC_DeadlineOvershootIsBoundedByTheCheckInterval|TestBudget_QueryHit|TestBudget_QueryMiss|TestBudget_Record|TestBudget_RebuildBloom|TestBudget_RefreshStaleness|TestBudget_Open|TestBudget_DetectorScan|TestBudgetBF|TestIntegration_HotPathWarmWithRealResidentState|TestFeaturesFrom_LexicalCohesionShingleCap)$' ./internal/store ./internal/negknow ./internal/mcp ./internal/daemon ./test/integration

  # `devtool cover` runs two passes (tools/devtool/cover.go, coverPasses): the tree but test/e2e in
  # parallel under its own co-load declaration, then test/e2e alone without it, as `test-e2e` runs
  # it (ADR 0010 decision 4). Inside the whole-tree pass the live-path e2e rows' hooks took the
  # designed degrade to the client spool, and TestE2EHookRoundTrip, which counts the WAL, was red
  # here in runs 34804619564 and 36816905394 while `test-e2e` passed it. The e2e pass judges X11's
  # fsync-bound rows exactly as `test-e2e` does, so it carries the same non-reference-disk
  # declaration (owner Q1, D53(e)); devtool takes it back from the co-loaded pass, so no pass
  # names both causes.
  cover:
    runs-on: ubuntu-latest
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool cover
      # Uploaded whether or not the floors passed: a floor failure is exactly when the profile is
      # needed, and the first run to reach the floor stage (34800489027) had no profile to read
      # because this step was skipped behind it.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage.out }

  crossbuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool build-all

  bench-gate:
    # Required from the end of wave 1 onward (00-ARCH §8): test/bench/hotpath has landed (SP-05),
    # so this is no longer continue-on-error. Marking it a required check on develop/main is a
    # GitHub branch-protection setting, not a file in this repo — see task-7-report.md for the
    # controller note.
    #
    # This job gates the HOT-PATH budgets (B-A / B-E) only. On a hosted runner what it gates is
    # B-E_cpu and the delivery ledger; B-A, B-B and B-E's wall row are reported there, under the
    # non-reference-disk declaration below. §7's other half — the >10% warn /
    # >25% fail comparison of every micro-benchmark against testdata/bench-baseline.txt — is
    # `devtool bench-compare`, and the V2 checkpoint's decision is that it runs LOCALLY, on a
    # quiet machine, as part of §5.3's baseline discipline:
    #
    #     go run ./tools/devtool bench > v2-bench.txt
    #     go run ./tools/devtool bench-compare v2-bench.txt
    #
    # It is deliberately NOT a step here, and the reason is the baseline rather than the cost.
    # testdata/bench-baseline.txt was recorded on one Windows host whose isolated fsync measured
    # ~2.1 ms (recorded in docs/adr/, not in the file itself — it is raw `go test -bench` output with
    # no header block), and §5.3 says in as many words that the I/O-bound rows "will look
    # very different on the Linux CI runners" and that a large improvement there is a change of
    # machine, not a change of code. A 25% threshold fed cross-machine deltas fails constantly and
    # then gets switched off, which is a worse outcome than running it by hand — a gate that
    # cannot be trusted is the dead-gate failure mode this checkpoint exists to catch, arrived at
    # from the opposite direction. §5.3 also records BenchmarkRun_Bash100KB at ±33% run-to-run on
    # the reference host, which a 25% gate cannot distinguish from a regression even on the same
    # machine (SP04-D6).
    #
    # What would make it meaningful here: a per-OS baseline (bench-baseline-<os>.txt) recorded on
    # the runners themselves, so the comparison is like-for-like. Then this becomes one `run:`
    # line — the task, the thresholds and the unit-direction handling are already written.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ── Non-reference disk (owner Q1, third option; D53(e)) ──────────────────────────────────────
    # A GitHub-hosted runner's disk is not a reference disk: its fsync latency carries a tail no
    # budget priced on a quiet reference host survives (run 36816905394: ubuntu-latest B-B p50
    # 0.576 ms but p99 40.960 ms against 15; windows-latest p50 45 ms against 50; the quiet Windows
    # reference run C5.1 read p99 22.5 ms). Hosted figures never become constants (Q1), and this
    # runner is not co-loaded, so QOMPACK_UNDER_COLOAD would name the wrong cause. The declaration
    # reports, without gating, the fsync-bound wall rows (B-A, B-B, B-E's wall row) and the §12.2
    # spool-submode transition, each with a note naming it; B-E_cpu, the delivery ledger (identity,
    # 0 lost), the population census and every structural check stay gated. It is honoured only
    # where GITHUB_ACTIONS=true (internal/obs.NonReferenceDiskEnv), the owner's quiet reference runs
    # never set it, and test/guards' TestNonReferenceDisk_IsHostedCIOnly keeps both true.
    # The harness reads the declaration itself (test/bench/hotpath, wallWaiver), so the command
    # line below is the one a quiet reference run uses, byte for byte.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool bench-hotpath --iterations 2000 --hook observe-tool --warm-daemon --json "bench-${{ matrix.os }}.json"
      # `if: always()` because the run whose JSON is most worth having is the one that FAILED. The
      # harness writes the file and then exits non-zero on a breached gate, so without this the
      # upload is skipped exactly when a breach needs attributing, and the percentiles that would
      # say which budget moved and by how much are thrown away with the runner. The gate is
      # untouched: the job still fails on the step above. This is what makes the ubuntu-latest and
      # macos-latest figures readable at all, since neither platform is measurable locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "bench-${{ matrix.os }}", path: "bench-${{ matrix.os }}.json" }

  replay-gate:
    # A REQUIRED check from the end of wave 1 (§8): SP-02 landed test/replay, so the
    # continue-on-error placeholder is gone and a regression here blocks the merge.
    runs-on: ubuntu-latest
    # The backstop under the driver's own --max-wall ceiling, for the one case that ceiling cannot
    # see: both of its checks sample between sessions and after the run, so a single call that
    # never returns at all would sit here until GitHub's 360-minute platform default. This is a
    # deadlock bound and not a performance one — the driver's 15-minute ceiling fails first on
    # anything slower than it should be, and this only fires when the driver has stopped checking.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      # The pull-request body is where a §11.3 sign-off trailer lives. On a push event there is no
      # body, so the file is empty and NO regression can be signed off on a direct push — which is
      # correct: a trade-off nobody reviewed is not a trade-off anybody agreed to.
      - name: Capture the pull-request body for the sign-off scan
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      # --baseline names the baseline recorded over the corpus --corpus names, and the pairing is
      # checked rather than trusted: the driver refuses a baseline whose corpusSHA256 is not this
      # corpus's (checkCorpusIdentity, test/replay/gate.go) and exits 2 naming both digests. The V4
      # corpus correction moved that digest from e2d9fa5a... to ebaf30d2..., so phase0.json -- which
      # stays committed, unedited and M0-04-protected as the record of what the pre-correction
      # corpus said -- is no longer the baseline for this run. phase0-recall.json is.
      - run: >
          go run ./tools/devtool replay
          --corpus testdata/sessions/synthetic
          --baseline testdata/baseline/phase0-recall.json
          --phase 0
          --growth testdata/golden/eval/growth/stats-growth.json
          --sketch testdata/golden/eval/growth/health.json
          --signoff "$RUNNER_TEMP/pr-body.md"
          --max-cpu 2m
          --ci

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool plugin-validate
      - run: git diff --exit-code -- plugin/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run -modfile=tools/pinned/go.mod golang.org/x/vuln/cmd/govulncheck ./...
      - run: go run ./tools/devtool lint --only=importgraph,testdeps,bindeps
      # Each check is an explicit `if` that fails the step. The bare `! grep ...` lines this replaced
      # were only enforced while they were the LAST command of the script: bash -e does not exit on
      # a command whose status `!` inverts, so every check but the last could find an offender, print
      # it, and still let the step pass.
      #
      # `go list -deps` without -test reports each package's non-test imports only, so a _test.go
      # file's imports never appear here. internal/testutil and internal/paths/pathstest are test
      # support (§6.2): non-test packages, but ones only a test binary may link. The third and
      # fourth checks are what make their os/exec carve-out safe. The third reads direct imports:
      # no product package — anything under internal/ or cmd/ that is not test support itself —
      # imports either. It exempts test support as an importer, so a product package importing a
      # conformance package that imports pathstest would pass it; the fourth closes that by
      # reading what the shipped binary links, transitively: no test support package and no
      # `testing` package anywhere in `go list -deps ./cmd/...`, on all three release OSes. bindeps
      # cannot stand in for it: it allows every package under the module path.
      - name: import allowlist (§8, D10)
        run: |
          go list -deps -f '{{.ImportPath}} {{join .Imports " "}}' ./... > imports.txt
          product='^github.com/qompack/qompack/(internal|cmd)/'
          # Test support: internal/testutil, internal/paths/pathstest, and every conformance package
          # internal/<pkg>/<pkg>test.
          support='^github.com/qompack/qompack/internal/(testutil|paths/pathstest|([a-z0-9]+)/\2test) '
          rc=0
          # No network stack anywhere; `net` itself is permitted only in internal/ipc (unix sockets).
          if grep -E "$product" imports.txt | grep -Ev '^github.com/qompack/qompack/internal/ipc ' \
            | grep -E '\b(net/http|net/url|crypto/tls)\b'; then
            echo "::error::a product package imports a network stack (§8, D10)"; rc=1
          fi
          # os/exec allowlist: daemon (detached self-spawn), cli, testutil (§6.2 real-binary RunHook),
          # and pathstest, which runs `go env` once to pin the toolchain's cache locations before it
          # moves HOME (a9f276e7, b763d728). pathstest is test support exactly as testutil is.
          if grep -E "$product" imports.txt \
            | grep -Ev '^github.com/qompack/qompack/internal/(daemon|cli|testutil|paths/pathstest) ' \
            | grep -E '\bos/exec\b'; then
            echo "::error::a product package outside the os/exec allow-list imports os/exec (§8)"; rc=1
          fi
          # Test support stays test-only: no product package imports testutil or pathstest.
          if grep -E "$product" imports.txt | grep -Ev "$support" \
            | grep -E ' github.com/qompack/qompack/internal/(testutil|paths/pathstest)( |$)'; then
            echo "::error::a product package imports test support (internal/testutil or internal/paths/pathstest)"; rc=1
          fi
          # Nor does the shipped binary link test support or `testing` through any chain of imports.
          # grep exits 2 on a bad pattern or file, which an `if` alone would read as "no match", so
          # anything but 0 (a match) or 1 (none) fails the step too.
          linked='^(testing(/.*)?|github.com/qompack/qompack/internal/(testutil|paths/pathstest|([a-z0-9]+)/\4test))$'
          for goos in linux darwin windows; do
            GOOS=$goos go list -deps ./cmd/... > "shipped-$goos.txt"
            if grep -E "$linked" "shipped-$goos.txt"; then
              echo "::error::the $goos release binary links test support or testing"; rc=1
            elif [ "$?" -ne 1 ]; then
              echo "::error::grep could not check the $goos release binary's packages"; rc=1
            fi
          done
          exit "$rc"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool gen-config-docs --check
      - run: go run ./tools/devtool gen-mcp-docs --check
      - run: go run ./tools/devtool gen-command-docs --check
      - run: go test -count=1 ./test/docs/...

  # SP-17 Task 7. Every push proves the RELEASE path builds, not just the test path: the same gate
  # a tag runs (minus the tag/version agreement, which only a tag can satisfy) followed by the
  # bundle assembly and archiving a release would upload. A release path first exercised on the day
  # of a release is a release path nobody has tested.
  #
  # --skip-vulncheck is deliberate: the `security` job above already runs govulncheck on this same
  # commit, and a second full scan per push would buy nothing. The recorded SKIPPED says which run
  # this was.
  release-dry-run:
    runs-on: ubuntu-latest
    # ── Non-reference disk (owner Q1, third option; D53(e), D55) ─────────────────────────────────
    # release-check runs ci-local's `test` and `cover` steps, and each runs test/e2e in a pass of its
    # own (tools/devtool/test.go, wholeTreePasses), where X11 drives the hot-path harness alone on
    # this runner exactly as `test-e2e` and `cover` do. So this job judges the same fsync-bound rows
    # on the same hosted disk, and it carries the same declaration: run 36955046276's release-dry-run
    # (job 110676058084) failed X11 in its cover step on B-A/B-B p99 49.152 ms against 15, with B-B
    # p50 0.576 ms, after the same package had passed in its test step minutes earlier. The fsync-bound
    # wall rows (B-A, B-B, B-E's wall row), the §12.2 spool-submode transition and X10's late or
    # deferred prompt-reply recovery branch (written to the job summary) are reported, each with a
    # note naming the declaration; B-E_cpu, the delivery ledger (identity, 0 lost), the population
    # census and every structural check stay gated. devtool takes the declaration back from the
    # co-loaded whole-tree pass, which declares co-load instead, so no pass names both causes. It is
    # honoured only where GITHUB_ACTIONS=true (internal/obs.NonReferenceDiskEnv): the coordinator's
    # local release-check on the reference host judges those rows at their limits, and test/guards'
    # TestNonReferenceDisk_IsHostedCIOnly pins this job to the declaring set.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      - run: go run ./tools/devtool release-check --skip-vulncheck
      # The release path with a fixed dry-run version, as release.yml passes the tag's: the six
      # zips, checksums.txt, and the marketplace document generated from them.
      - run: go run ./tools/devtool bundle --archive --version 0.0.0-dryrun
      - run: go run ./tools/devtool marketplace --tag v0.0.0-dryrun --checksums dist/bundle/checksums.txt --out dist/bundle/marketplace.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-dry-run-bundles
          path: |
            dist/bundle/*.zip
            dist/bundle/checksums.txt
            dist/bundle/marketplace.json
            dist/release-check.json
