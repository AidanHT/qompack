name: marketplace

# C7.5: once a FULL release exists, pin its archives in the repository's marketplace.
#
# release.yml creates a DRAFT release carrying six per-target zips, checksums.txt and a
# marketplace.json generated from them. A draft fires nothing here. The trigger is `released`,
# which GitHub fires when a release is published as a full release AND when a pre-release is
# changed to a full release, and never for a pre-release. So the job runs exactly once per full
# release, by either route: publish directly, or publish as a pre-release, rehearse the install,
# then promote it (docs/release.md). `published` was the trigger until V6 close-out D53(e): it
# fires for the pre-release (skipped below) and not for the promotion, so that route never opened
# the pull request. test/guards/marketplace_workflow_test.go pins the trigger.
# This job then re-downloads what GitHub actually serves, re-verifies every zip against the
# release's own checksums.txt, regenerates the marketplace from the served bytes, requires it to
# equal the uploaded marketplace.json, and opens a pull request onto develop — the default branch
# `/plugin marketplace add AidanHT/qompack` reads — that puts it at .claude-plugin/marketplace.json.
# Nothing is merged or pushed to develop by this workflow: the pull request is the review point.
#
# The regeneration runs at the RELEASE'S commit, with the generator that wrote the uploaded
# document; develop's may have changed since the tag, and would then fail the byte comparison
# (test/guards/marketplace_workflow_test.go). Only the pull request is built on develop. A re-run
# after a partial failure replaces marketplace/<tag> under an explicit lease and reuses an open
# pull request instead of failing on the state the first run left.
#
# A pre-release is not pinned (the guard on the job is a second line behind the trigger). Test one
# by adding its release asset directly:
#   claude plugin marketplace add https://github.com/AidanHT/qompack/releases/download/<tag>/marketplace.json
#
# Owner prerequisite: Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests" must be on, or `gh pr create` below is refused. A pull request opened with
# GITHUB_TOKEN does not trigger other workflows, so CI on it starts when someone pushes to it or
# re-runs it.

on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: marketplace-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'
  TAG: ${{ github.event.release.tag_name }}

jobs:
  pin:
    if: startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # The release's own commit (fetch-depth 0 also brings origin/develop and any earlier run's
      # marketplace/<tag> branch, which the last step needs).
      - uses: actions/checkout@v4
        with: { ref: 'refs/tags/${{ github.event.release.tag_name }}', fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      - name: download the published archives, checksums and marketplace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist/published
          gh release download "$TAG" --dir dist/published \
            --pattern 'qompack-plugin-*.zip' --pattern checksums.txt --pattern marketplace.json
          ls -l dist/published
      - name: re-verify every archive against the release's checksums.txt
        working-directory: dist/published
        run: sha256sum --strict -c checksums.txt
      - name: digest exactly what GitHub serves, and require it to be what was released
        run: |
          (cd dist/published && sha256sum qompack-plugin-*.zip) > dist/served.sha256
          diff <(sort dist/published/checksums.txt) <(sort dist/served.sha256)
      - name: regenerate the marketplace from the served bytes with the release's generator
        run: |
          mkdir -p dist/generated
          go run ./tools/devtool marketplace --tag "$TAG" --checksums dist/served.sha256 \
            --out dist/generated/marketplace.json
          go run ./tools/devtool marketplace --validate dist/generated/marketplace.json
          cmp dist/generated/marketplace.json dist/published/marketplace.json
      - name: open or update the pull request onto develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="marketplace/$TAG"
          git switch -C "$branch" origin/develop
          mkdir -p .claude-plugin
          cp dist/generated/marketplace.json .claude-plugin/marketplace.json
          if git diff --quiet -- .claude-plugin/marketplace.json && \
             git ls-files --error-unmatch .claude-plugin/marketplace.json >/dev/null 2>&1; then
            echo "develop already pins $TAG"
            exit 0
          fi
          git add .claude-plugin/marketplace.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(marketplace): pin the $TAG release archives" \
              -m "Generated by devtool marketplace from the sha256 of each published zip, re-verified against the release's checksums.txt."
          # An earlier run of this job may have pushed the branch already. Replace it only if it
          # still points where this checkout saw it (empty: it must not exist yet).
          expect="$(git rev-parse -q --verify "refs/remotes/origin/$branch" || true)"
          git push --force-with-lease="refs/heads/$branch:$expect" origin "$branch"
          open="$(gh pr list --head "$branch" --base develop --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            echo "pull request #$open already proposes $branch; the push above updated it"
            exit 0
          fi
          gh pr create --base develop --head "$branch" \
            --title "chore(marketplace): pin the $TAG release archives" \
            --body "Pins the six per-target archive entries of .claude-plugin/marketplace.json to the $TAG release zips (sha256 re-verified against the release's checksums.txt, and equal to the uploaded marketplace.json). Merging it is what makes \`/plugin marketplace add AidanHT/qompack\` offer $TAG."
