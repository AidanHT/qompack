name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.x', cache: true }
      - name: verify before releasing
        run: |
          go run ./tools/devtool ci-local
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SP-17 owns plugin bundle assembly (plugin/bin population) and provenance attestation.
      # The pipeline is wired here so the tag-triggered path exists from wave 0 onward.
