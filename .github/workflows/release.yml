name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.6', cache: true }
      # The gate, before anything is built or published. It runs ci-local's own sequence plus the
      # steps ci-local omits (build-all, govulncheck, the generated-doc checks, the licence
      # inventory, real-binary determinism and the rollback rehearsal), and refuses a tag whose
      # version does not already equal internal/core.Version.
      - name: release-check
        run: |
          go run ./tools/devtool release-check --tag "$GITHUB_REF_NAME"
      # One build path produces every shipped byte. --host-validate asks the host's own validator;
      # the claude CLI is NOT installed on a GitHub runner, so the record it writes says
      # "unverified: claude CLI not on PATH". That is evidence of absence and is uploaded as such —
      # it is never a pass, and nothing downstream may read it as one.
      - name: assemble and archive the bundles
        run: |
          go run ./tools/devtool bundle --version "${GITHUB_REF_NAME#v}" --archive --host-validate --evidence dist/evidence/host-validation.json
      # The marketplace document, generated from the checksums.txt just written, so every entry is
      # pinned to the sha256 of the zip this release uploads. It ships as a release asset: users can
      # add it by URL straight away, and marketplace.yml copies it into .claude-plugin/ on develop
      # only after the release is PUBLISHED (a draft stays a draft).
      - name: generate the marketplace from the archives' checksums
        run: |
          go run ./tools/devtool marketplace --tag "$GITHUB_REF_NAME" --checksums dist/bundle/checksums.txt --out dist/bundle/marketplace.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-validation-evidence
          path: dist/evidence/
          if-no-files-found: error
      # The draft release's notes ARE the supported-scope accounting: per target and per acceptance
      # row, what a committed record establishes and what stays unverified.
      - name: release notes from the evidence
        run: |
          go run ./tools/devtool release-scope --markdown > dist/release-notes.md
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/bundle/*.zip
            dist/bundle/marketplace.json
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser builds nothing (.goreleaser.yaml: every build entry is skipped) and creates a
      # DRAFT release carrying the archives, checksums and marketplace document assembled above.
      # Publishing it is a person's decision, taken after reading the scope table in its notes.
