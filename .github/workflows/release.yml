name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  release:
    runs-on: ubuntu-24.04
    # ── Non-reference disk (owner Q1, third option; D53(e), D55) ─────────────────────────────────
    # The gate below is release-check, the same one ci.yml's release-dry-run runs on every push, and
    # it runs test/e2e's X11 alone on this hosted runner twice (ci-local's test and cover steps). A
    # GitHub-hosted disk carries an fsync tail no budget priced on a reference host survives (run
    # 36955046276's release-dry-run: ubuntu-latest B-A/B-B p99 49.152 ms against 15, B-B p50
    # 0.576 ms), so without this declaration a real release would be refused on a figure that
    # measures the runner's disk. Hosted figures never become constants (Q1). The fsync-bound wall
    # rows (B-A, B-B, B-E's wall row), the §12.2 spool-submode transition and X10's late or deferred
    # prompt-reply recovery branch are reported, each with a note naming the declaration; B-E_cpu,
    # the delivery ledger (identity, 0 lost), the population census, every structural check and
    # every other release-check step stay gated. It is honoured only where GITHUB_ACTIONS=true
    # (internal/obs.NonReferenceDiskEnv), so the reference verdict on those rows is the local
    # release-check on the reference host that docs/release.md §1 step 3 requires before the tag.
    # This declaration carries D53(e)/D55 to the tag-time gate, as recorded in ledger decision D57(a).
    # test/guards' TestNonReferenceDisk_IsHostedCIOnly pins this job as release.yml's only declaring
    # job.
    env:
      QOMPACK_NONREFERENCE_DISK: '1'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.9', cache: true }
      # The gate, before anything is built or published. It runs ci-local's own sequence plus the
      # steps ci-local omits (build-all, govulncheck, the generated-doc checks, the licence
      # inventory, real-binary determinism and the rollback rehearsal), and refuses a tag whose
      # version does not already equal internal/core.Version.
      - name: release-check
        run: |
          go run ./tools/devtool release-check --tag "$GITHUB_REF_NAME"
      # One build path produces every shipped byte. --host-validate asks the host's own validator;
      # the claude CLI is NOT installed on a GitHub runner, so the record it writes says
      # "unverified: claude CLI not on PATH". That is evidence of absence and is uploaded as such —
      # it is never a pass, and nothing downstream may read it as one.
      - name: assemble and archive the bundles
        run: |
          go run ./tools/devtool bundle --version "${GITHUB_REF_NAME#v}" --archive --host-validate --evidence dist/evidence/host-validation.json
      # The marketplace document, generated from the checksums.txt just written, so every entry is
      # pinned to the sha256 of the zip this release uploads. It ships as a release asset: users can
      # add it by URL straight away, and marketplace.yml copies it into .claude-plugin/ on develop
      # only after the release is PUBLISHED (a draft stays a draft).
      - name: generate the marketplace from the archives' checksums
        run: |
          go run ./tools/devtool marketplace --tag "$GITHUB_REF_NAME" --checksums dist/bundle/checksums.txt --out dist/bundle/marketplace.json
      - uses: actions/upload-artifact@v4
        with:
          name: host-validation-evidence
          path: dist/evidence/
          if-no-files-found: error
      # The draft release's notes. A tag whose version has hand-written notes in
      # docs/release-notes/<tag>.md uses them: they cite the close-out evidence for that release,
      # which release-scope's committed SP-17 records predate. Any other tag falls back to the
      # supported-scope accounting: per target and per acceptance row, what a committed record
      # establishes and what stays unverified. test/guards pins both branches.
      - name: release notes from the evidence
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" dist/release-notes.md
          else
            go run ./tools/devtool release-scope --markdown > dist/release-notes.md
          fi
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/bundle/*.zip
            dist/bundle/marketplace.json
      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes dist/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser builds nothing (.goreleaser.yaml: every build entry is skipped) and creates a
      # DRAFT pre-release (.goreleaser.yaml: prerelease) carrying the archives, checksums and
      # marketplace document assembled above. Publishing it is a person's decision, taken after
      # reading its notes; promoting it to the latest release is a second one (D53(h)).
